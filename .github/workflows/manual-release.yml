name: Manual release

# Custom semver tag (e.g. 0.2.0). Triggers release.yml like develop auto-releases.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without v prefix (e.g. 0.2.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag:
    name: Create release tag
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        run: |
          ver="${{ github.event.inputs.version }}"
          if ! echo "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must look like X.Y.Z (got: $ver)"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create and push tag
        run: |
          tag="v${{ github.event.inputs.version }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
