name: Manual release

# Custom semver (e.g. 0.2.0 for minor/major bumps).
on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without v prefix (e.g. 0.2.0)
        required: true
        type: string

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check version format
        run: |
          ver="${{ github.event.inputs.version }}"
          if ! echo "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must look like X.Y.Z (got: $ver)"
            exit 1
          fi

      - id: tag
        run: echo "tag=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fail if tag already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ github.event.inputs.version }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists."
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists."
            exit 1
          fi

  release:
    name: Build and publish release
    needs: validate
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.validate.outputs.tag }}
    secrets: inherit
