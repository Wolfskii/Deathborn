name: Release

# Called by develop-release / manual-release, or triggered by a local `git push origin vX.Y.Z`.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.0)
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  actions: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # Keep this many GitHub Releases and GHCR package versions.
  RELEASE_RETENTION_COUNT: 5

jobs:
  prepare-release:
    name: Prune old releases and open draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prune old GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          KEEP: ${{ env.RELEASE_RETENTION_COUNT }}
        run: |
          set -euo pipefail
          mapfile -t published < <(
            gh release list --limit 100 --json tagName,isDraft,isPrerelease \
              -q '.[] | select(.isDraft==false and .isPrerelease==false) | .tagName' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V -r
          )
          for i in "${!published[@]}"; do
            if (( i >= KEEP )); then
              tag="${published[$i]}"
              echo "Pruning published release $tag (keeping newest $KEEP)"
              gh release delete "$tag" --yes 2>/dev/null || true
            fi
          done
          # Drop stale drafts (not the release we are building now).
          while IFS= read -r draft_tag; do
            [ -n "$draft_tag" ] || continue
            [ "$draft_tag" = "$RELEASE_TAG" ] && continue
            echo "Removing stale draft $draft_tag"
            gh release delete "$draft_tag" --yes --cleanup-tag 2>/dev/null || true
          done < <(
            gh release list --limit 50 --json tagName,isDraft \
              -q '.[] | select(.isDraft==true) | .tagName'
          )

      - name: Free Actions artifact storage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Releases upload directly to GitHub Releases; artifacts are not needed.
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" || true
          done < <(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --paginate \
              -q '.artifacts[] | select(.expired==false) | .id'
          )

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --yes --cleanup-tag
          fi
          gh release create "$RELEASE_TAG" \
            --target "${{ github.sha }}" \
            --draft \
            --title "Deathborn ${RELEASE_TAG}" \
            --notes "Client builds in progress. Download links will appear when the release is published."
          if gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Draft ${RELEASE_TAG} created; git tag present on GitHub"
          else
            echo "Draft ${RELEASE_TAG} created; tag will be ensured at publish time"
          fi

  client:
    name: Client (${{ matrix.rid }})
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
          - runner: ubuntu-latest
            rid: linux-x64
          - runner: macos-latest
            rid: osx-x64
          - runner: macos-latest
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v6
        if: runner.os == 'Windows'
        with:
          python-version: "3.12"

      - name: Install MGCB native dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        working-directory: client
        run: |
          set -euo pipefail
          brew install freeimage freetype
          ln -sf /opt/homebrew/lib/libfreetype.6.dylib /opt/homebrew/lib/libfreetype6.dylib
          dotnet tool restore
          MGCB_DIR="$(find "$HOME/.nuget/packages/dotnet-mgcb" -path '*/tools/net8.0/any' -type d | head -1)"
          test -n "$MGCB_DIR"
          cp /opt/homebrew/lib/libfreetype.6.dylib "$MGCB_DIR/libfreetype6.dylib"
          cp /opt/homebrew/lib/libfreeimage.dylib "$MGCB_DIR/libFreeImage.dylib"

      - name: Publish Deathborn client
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          cd client
          dotnet tool restore
          dotnet restore Deathborn.Client.sln
          dotnet publish Deathborn.Client/Deathborn.Client.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:Version="$version" \
            -o "publish/${{ matrix.rid }}"

      - name: Portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "dist/Deathborn-$version-${{ matrix.rid }}.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "client/publish/${{ matrix.rid }}/*" -DestinationPath $zip

      - name: Portable zip (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          (cd "client/publish/${{ matrix.rid }}" && zip -r "../../../dist/Deathborn-${version}-${{ matrix.rid }}.zip" .)

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Windows installer (Setup.exe)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          pip install pillow
          python installer/prepare_assets.py
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not found at $iscc" }
          & $iscc "-DMyAppVersion=$version" "installer\Deathborn.iss"

      - name: Linux package (tar.gz + install.sh)
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          bash installer/package-linux.sh "$version" "${{ matrix.rid }}"

      - name: macOS package (.dmg)
        if: runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          bash installer/package-macos.sh "$version" "${{ matrix.rid }}"

      - name: Upload client assets to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.zip dist/*.tar.gz dist/*.dmg dist/*-Setup.exe)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release files found in dist/" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber

  docker:
    name: Server Docker (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=latest

      - name: Build and push server image
        uses: docker/build-push-action@v7
        with:
          context: server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.RELEASE_TAG }}

      - name: Prune old GHCR package versions
        env:
          GH_TOKEN: ${{ github.token }}
          PRUNE_KEEP: ${{ env.RELEASE_RETENTION_COUNT }}
        run: bash .github/scripts/prune-ghcr-versions.sh

  finalize-release:
    name: Publish GitHub Release
    needs: [client, prepare-release]
    if: >-
      always() &&
      needs.prepare-release.result == 'success' &&
      needs.client.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Add checksums, download links, tag verify, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: bash .github/scripts/publish-release.sh "$RELEASE_TAG" "${{ github.sha }}"
