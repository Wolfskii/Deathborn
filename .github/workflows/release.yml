name: Release

# Called by develop-release / manual-release, or triggered by a local `git push origin vX.Y.Z`.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.0)
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  client:
    name: Client (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
          - runner: ubuntu-latest
            rid: linux-x64
          - runner: macos-latest
            rid: osx-x64
          - runner: macos-latest
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v6
        if: runner.os == 'Windows'
        with:
          python-version: "3.12"

      - name: Install MGCB native dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install freeimage freetype
          ln -sf /opt/homebrew/lib/libfreetype.6.dylib /opt/homebrew/lib/libfreetype6.dylib
          dotnet tool restore
          MGCB_DIR="$(find "$HOME/.nuget/packages/dotnet-mgcb" -path '*/tools/net8.0/any' -type d | head -1)"
          test -n "$MGCB_DIR"
          cp /opt/homebrew/lib/libfreetype.6.dylib "$MGCB_DIR/libfreetype6.dylib"
          cp /opt/homebrew/lib/libfreeimage.dylib "$MGCB_DIR/libFreeImage.dylib"

      - name: Publish Deathborn client
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          cd client
          dotnet tool restore
          dotnet restore Deathborn.Client.sln
          dotnet publish Deathborn.Client/Deathborn.Client.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:Version="$version" \
            -o "publish/${{ matrix.rid }}"

      - name: Portable zip
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          (cd "client/publish/${{ matrix.rid }}" && zip -r "../../../dist/Deathborn-${version}-${{ matrix.rid }}.zip" .)

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Windows installer (Setup.exe)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          pip install pillow
          python installer/prepare_assets.py
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not found at $iscc" }
          & $iscc "-DMyAppVersion=$version" "installer\Deathborn.iss"

      - name: Linux package (tar.gz + install.sh)
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          bash installer/package-linux.sh "$version" "${{ matrix.rid }}"

      - name: macOS package (.dmg)
        if: runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          bash installer/package-macos.sh "$version" "${{ matrix.rid }}"

      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.rid }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.dmg
            dist/*-Setup.exe
          if-no-files-found: error

  docker:
    name: Server Docker (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=latest

      - name: Build and push server image
        uses: docker/build-push-action@v7
        with:
          context: server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.RELEASE_TAG }}

  github-release:
    name: GitHub Release (client downloads)
    needs: [client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          pattern: client-*
          path: dist
          merge-multiple: true

      - name: Flatten artifact layout
        run: |
          shopt -s nullglob
          mkdir -p release
          find dist -type f \( \
            -name '*.zip' -o \
            -name '*.tar.gz' -o \
            -name '*.dmg' -o \
            -name '*-Setup.exe' \
          \) -exec cp {} release/ \;
          ls -la release/
          test "$(find release -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' | wc -l)" -gt 0

      - name: Generate checksums
        run: |
          cd release
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Generate changelog
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          prev="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -vFx "$RELEASE_TAG" | head -1 || true)"
          {
            echo "## What's Changed"
            echo ""
            if [ -z "$prev" ]; then
              git log --pretty=format:'- %s (%h)' --reverse
            else
              git log "${prev}..HEAD" --pretty=format:'- %s (%h)' --reverse
            fi
            echo ""
            echo ""
            echo "## Client downloads"
            echo ""
            echo "| Platform | Portable | Installer |"
            echo "| --- | --- | --- |"
            echo "| Windows x64 | \`Deathborn-*-win-x64.zip\` | \`Deathborn-*-win-x64-Setup.exe\` |"
            echo "| Linux x64 | \`Deathborn-*-linux-x64.zip\` | \`Deathborn-*-linux-x64.tar.gz\` (run \`install.sh\`) |"
            echo "| macOS Intel | \`Deathborn-*-osx-x64.zip\` | \`Deathborn-*-osx-x64.dmg\` |"
            echo "| macOS Apple Silicon | \`Deathborn-*-osx-arm64.zip\` | \`Deathborn-*-osx-arm64.dmg\` |"
            echo ""
            if [ -n "$prev" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${prev}...${RELEASE_TAG}"
            fi
          } > release-notes.md
          echo "Changelog entries: $(grep -c '^- ' release-notes.md || true)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Deathborn ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          files: |
            release/*
            !release/release-notes.md
