name: Release

# Triggered by version tags (auto from develop or manual workflow).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  client:
    name: Client (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
          - runner: ubuntu-latest
            rid: linux-x64
          - runner: macos-latest
            rid: osx-x64
          - runner: macos-latest
            rid: osx-arm64
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Publish Deathborn client
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          dotnet tool restore
          dotnet restore Deathborn.Client.sln
          dotnet publish Deathborn.Client/Deathborn.Client.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:Version="$version" \
            -o publish

      - name: Pack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: client
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          New-Item -ItemType Directory -Force -Path ../dist | Out-Null
          Compress-Archive -Path "publish/*" -DestinationPath "../dist/Deathborn-$version-${{ matrix.rid }}.zip"

      - name: Pack (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          (cd client/publish && zip -r "../../dist/Deathborn-${version}-${{ matrix.rid }}.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.rid }}
          path: dist/*.zip
          if-no-files-found: error

  docker:
    name: Server Docker (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push server image
        uses: docker/build-push-action@v7
        with:
          context: server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}

  github-release:
    name: GitHub Release (client downloads)
    needs: [client, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Flatten artifact layout
        run: |
          shopt -s nullglob
          mkdir -p release
          find dist -name '*.zip' -exec cp {} release/ \;
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum *.zip > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Deathborn ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.zip
            release/SHA256SUMS.txt
