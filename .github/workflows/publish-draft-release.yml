name: Publish draft release

# Publish an existing draft that already has uploaded assets (e.g. finalize failed).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.1.22)
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve commit SHA for tag
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          sha="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" -q '.target_commitish')"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-release.sh "${{ inputs.tag }}" "${{ steps.sha.outputs.sha }}"
