name: Develop release

# Auto patch release on every merge to develop. Tags + GitHub Release are created in one run
# (GITHUB_TOKEN tag pushes do not trigger other workflows).
#
# CI (.github/workflows/ci.yml) only builds/tests — it does NOT publish releases.
on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      force:
        description: Re-run patch release even if the latest tag already has a GitHub Release
        type: boolean
        default: false

concurrency:
  group: develop-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  version:
    name: Compute next patch version
    runs-on: ubuntu-latest
    if: >-
      !contains(github.event.head_commit.message, '[skip release]') &&
      !startsWith(github.event.head_commit.message, 'chore(release):')
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next patch version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh release list --limit 100 --json tagName,isDraft,prerelease \
            -q '.[] | select(.isDraft==false and .prerelease==false) | .tagName' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          if [ -z "$latest" ]; then
            latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)"
          fi
          if [ -z "$latest" ]; then
            next="0.1.0"
          else
            ver="${latest#v}"
            major="${ver%%.*}"
            rest="${ver#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            next="${major}.${minor}.$((patch + 1))"
          fi
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "Latest published: ${latest:-<none>}"
          echo "Next release: v$next"

      - name: Skip if tag or release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if [ "${FORCE}" = "true" ]; then
            echo "Force release requested for $tag"
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --json isDraft -q '.isDraft')"
            asset_count="$(gh release view "$tag" --json assets -q '.assets | length')"
            if [ "$is_draft" = "true" ] && [ "$asset_count" -gt 0 ]; then
              echo "Draft $tag already has ${asset_count} assets."
              echo "Publish it with Actions -> Publish draft release (or re-run failed finalize job)."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$is_draft" = "true" ] || [ "$asset_count" -eq 0 ]; then
              echo "Retrying incomplete release $tag"
              gh release delete "$tag" --yes --cleanup-tag
              echo "skip=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "GitHub release $tag already published with assets."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Removing orphan tag $tag"
            git push origin ":refs/tags/${tag}" 2>/dev/null || true
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

  release:
    name: Build and publish release
    needs: version
    if: >-
      needs.version.result == 'success' &&
      needs.version.outputs.skip == 'false'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit
