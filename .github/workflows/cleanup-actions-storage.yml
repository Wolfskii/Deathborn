name: Cleanup Actions storage

# One-off or occasional cleanup when artifact quota is full.
# Releases no longer use workflow artifacts; this deletes leftover blobs.
on:
  workflow_dispatch:
    inputs:
      keep_releases:
        description: Number of newest semver GitHub Releases and GHCR versions to keep
        required: true
        default: "5"
        type: string

permissions:
  contents: write
  actions: write
  packages: write

jobs:
  cleanup:
    name: Prune releases, packages, and artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prune old GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ github.event.inputs.keep_releases }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname)
          for i in "${!tags[@]}"; do
            if (( i >= KEEP )); then
              tag="${tags[$i]}"
              echo "Deleting GitHub Release $tag"
              gh release delete "$tag" --yes 2>/dev/null || true
            fi
          done

      - name: Prune old GHCR package versions
        env:
          GH_TOKEN: ${{ github.token }}
          PRUNE_KEEP: ${{ github.event.inputs.keep_releases }}
        run: bash .github/scripts/prune-ghcr-versions.sh

      - name: Delete all workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deleted=0
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" && deleted=$((deleted + 1)) || true
          done < <(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --paginate \
              -q '.artifacts[] | select(.expired==false) | .id'
          )
          echo "Deleted $deleted artifact(s)"
