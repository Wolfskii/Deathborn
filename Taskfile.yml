# DEATHBORN task runner (https://taskfile.dev).
# Install: https://taskfile.dev/installation/  then run `task` to list tasks.
version: "3"

vars:
  SERVER_DIR: server
  CLIENT_DIR: client
  CLIENT_PROJECT: client/Deathborn.Client/Deathborn.Client.csproj
  BINARY: deathborn
  IMAGE: deathborn-server
  DEV_DATABASE_URL: postgres://deathborn:deathborn@localhost:5432/deathborn?sslmode=disable
  DEV_JWT_SECRET: dev-secret-change-me
  DEV_PORT: "8080"
  # Version derived from git tags; falls back to "dev" outside a repo.
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: -s -w -X main.version={{.VERSION}}

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  # --- Run the full stack (Docker Compose) ---
  start:
    desc: Build and run the full stack (Postgres + server) in the foreground
    cmds:
      - docker compose up --build

  up:
    desc: Start the full stack in the background (Docker only — no local client)
    cmds:
      - docker compose up --build -d

  stop:
    desc: Stop and remove the stack containers
    cmds:
      - docker compose down

  restart:
    desc: Restart the stack in the background
    cmds:
      - task: stop
      - task: up

  logs:
    desc: Follow the server logs
    cmds:
      - docker compose logs -f server

  ps:
    desc: Show stack container status
    cmds:
      - docker compose ps

  # --- Local development (recommended for game client work) ---
  dev:
    desc: Local dev — Postgres in Docker, Go server + MonoGame client on host
    cmds:
      - task: dev:all

  dev:all:
    desc: Start DB, backend, and two clients for local multiplayer (Ctrl+C stops everything)
    cmds:
      - task: db
      - task: dev:wait-db
      - bash scripts/dev-all.sh

  dev:server:
    desc: Run only the Go server on the host (expects `task db` already running)
    deps: [db, dev:wait-db]
    dir: "{{.SERVER_DIR}}"
    env:
      DATABASE_URL: "{{.DEV_DATABASE_URL}}"
      JWT_SECRET: "{{.DEV_JWT_SECRET}}"
      PORT: "{{.DEV_PORT}}"
      LISTEN_HOST: "127.0.0.1"
    cmds:
      - go build -o ../bin/{{.BINARY}} ./cmd/deathborn
      - ../bin/{{.BINARY}}

  dev:client:
    desc: Run only the MonoGame client with auto-restart on file changes
    dir: "{{.CLIENT_DIR}}"
    cmds:
      - dotnet tool restore
      - dotnet watch run --project Deathborn.Client --configuration Debug --no-hot-reload

  dev:wait-db:
    desc: Wait until the Dockerized Postgres accepts connections
    internal: true
    cmds:
      - |
        echo "Waiting for PostgreSQL..."
        for i in $(seq 1 30); do
          if docker compose exec -T db pg_isready -U deathborn -d deathborn >/dev/null 2>&1; then
            echo "PostgreSQL is ready."
            exit 0
          fi
          sleep 1
        done
        echo "PostgreSQL did not become ready in time. Is Docker running?"
        exit 1

  db:
    desc: Start only PostgreSQL in Docker
    cmds:
      - docker compose up -d db

  # --- MonoGame C# client (aliases) ---
  client:
    desc: Run the MonoGame client (alias for dev:client)
    cmds:
      - task: dev:client

  client:build:
    desc: Build the MonoGame client (Release)
    dir: "{{.CLIENT_DIR}}"
    cmds:
      - dotnet tool restore
      - dotnet build Deathborn.Client/Deathborn.Client.csproj -c Release

  client:restore:
    desc: Restore NuGet packages and dotnet tools for the client
    dir: "{{.CLIENT_DIR}}"
    cmds:
      - dotnet tool restore
      - dotnet restore Deathborn.Client.sln

  # --- Build ---
  build:
    desc: Build the server binary into ./bin (version-stamped)
    dir: "{{.SERVER_DIR}}"
    env:
      CGO_ENABLED: "0"
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o ../bin/{{.BINARY}} ./cmd/deathborn
    generates:
      - ../bin/{{.BINARY}}

  build:image:
    desc: Build the server Docker image, tagged with the current version and latest
    cmds:
      - docker build -t {{.IMAGE}}:{{.VERSION}} -t {{.IMAGE}}:latest {{.SERVER_DIR}}

  # --- Quality ---
  fmt:
    desc: Format Go code
    dir: "{{.SERVER_DIR}}"
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Fail if any Go file is not gofmt-clean
    dir: "{{.SERVER_DIR}}"
    cmds:
      - test -z "$(gofmt -l .)" || (echo "Run 'task fmt' on:"; gofmt -l .; exit 1)

  vet:
    desc: Run go vet
    dir: "{{.SERVER_DIR}}"
    cmds:
      - go vet ./...

  test:
    desc: Run Go tests
    dir: "{{.SERVER_DIR}}"
    cmds:
      - go test ./...

  tidy:
    desc: Tidy Go modules
    dir: "{{.SERVER_DIR}}"
    cmds:
      - go mod tidy

  check:
    desc: Run all checks (server fmt/vet/test + client build) — mirrors CI
    cmds:
      - task: fmt:check
      - task: vet
      - task: test
      - task: client:build

  # --- Deploy / release ---
  publish:image:
    desc: 'Push the image to a registry. Set REGISTRY, e.g. REGISTRY=ghcr.io/you task publish:image'
    requires:
      vars: [REGISTRY]
    cmds:
      - docker build -t {{.REGISTRY}}/{{.IMAGE}}:{{.VERSION}} -t {{.REGISTRY}}/{{.IMAGE}}:latest {{.SERVER_DIR}}
      - docker push {{.REGISTRY}}/{{.IMAGE}}:{{.VERSION}}
      - docker push {{.REGISTRY}}/{{.IMAGE}}:latest

  release:
    desc: "Manual semver release via GitHub Actions (minor/major bumps): gh workflow run manual-release.yml -f version=0.2.0"
    cmds:
      - cmd: 'test -n "{{.CLI_ARGS}}" || (echo "Usage: task release -- 0.2.0  (or merge to develop for auto patch releases)"; exit 1)'
        silent: true
      - cmd: 'echo "{{.CLI_ARGS}}" | grep -Eq "^[0-9]+\.[0-9]+\.[0-9]+$" || (echo "Version must look like X.Y.Z"; exit 1)'
        silent: true
      - gh workflow run manual-release.yml -f version={{.CLI_ARGS}}

  # --- Cleanup ---
  clean:
    desc: Remove build artifacts and tear down the stack (including the DB volume)
    cmds:
      - docker compose down -v
      - rm -rf bin dist
      - dotnet clean client/Deathborn.Client.sln 2>/dev/null || true
