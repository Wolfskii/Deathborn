# Deathborn backend — Docker Compose
#
# Dokploy / production (external Postgres 18 on Dokploy):
#   1. Create a Postgres 18 database service in Dokploy (note host, port, user, password, db name).
#   2. Copy .env.example → .env and set DATABASE_URL + JWT_SECRET.
#   3. Deploy this compose file (server service only — no bundled db).
#      docker compose up -d --build
#   Server joins `dokploy-network` so it can resolve Dokploy-managed Postgres hostnames.
#   Local `task up`: run once — docker network create dokploy-network
#
# Local full stack (bundled Postgres 18):
#   docker compose --profile local up --build -d
#   # or: task up

name: deathborn

services:
  server:
    build:
      context: ./server
      args:
        VERSION: ${VERSION:-dev}
    image: deathborn-server:${VERSION:-dev}
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    # Dokploy writes UI env vars to `.env` next to this file; load them into the container.
    # See https://docs.dokploy.com/docs/core/docker-compose#environment
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-deathborn}:${POSTGRES_PASSWORD:-deathborn}@db:5432/${POSTGRES_DB:-deathborn}?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PORT: ${PORT:-8080}
      # Leave empty in Docker/Dokploy so the server binds 0.0.0.0
      LISTEN_HOST: ${LISTEN_HOST:-}
    depends_on:
      db:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- \"http://127.0.0.1:$${PORT:-8080}/health\" | grep -q ok",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - default
      - dokploy-network
    # Uncomment when using a pre-built GHCR image instead of building on Dokploy:
    # image: ghcr.io/<owner>/deathborn:latest

  db:
    profiles: [local]
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deathborn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deathborn}
      POSTGRES_DB: ${POSTGRES_DB:-deathborn}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PG 18+ stores data under /var/lib/postgresql/<major>/ (not .../data).
      - dbdata:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-deathborn} -d $${POSTGRES_DB:-deathborn}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dbdata:

networks:
  dokploy-network:
    external: true
