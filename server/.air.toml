# Air live-reload for the Deathborn Go server (https://github.com/air-verse/air).
# Used by: task dev:server / scripts/dev-all.sh
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/deathborn ./cmd/deathborn"
  bin = "./tmp/deathborn"
  entrypoint = ["./tmp/deathborn"]
  include_ext = ["go", "sql", "toml"]
  exclude_dir = ["tmp", "vendor", "testdata", "bin"]
  exclude_regex = ["_test\\.go"]
  delay = 600
  stop_on_error = true
  send_interrupt = true
  kill_delay = "500ms"

# Requires Air >= 1.64 (platform overrides). Older Air ignores this block and
# builds a non-.exe binary while still trying to run tmp\main.exe on Windows.
[build.windows]
  cmd = "go build -o ./tmp/deathborn.exe ./cmd/deathborn"
  bin = "tmp\\deathborn.exe"
  entrypoint = ["tmp\\deathborn.exe"]

[log]
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
